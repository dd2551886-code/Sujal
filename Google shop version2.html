<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial;
    background:#f5f7fb;
    color:#222;
    transition:.3s;
}

body.dark{
    background:#121212;
    color:white;
}

nav{
    position:sticky;
    top:0;
    z-index:10;
    background:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 15px #0002;
}

.dark nav{
    background:#202124;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#4285f4;
}

.links{
    display:flex;
    gap:15px;
    align-items:center;
}

.links button{
    border:0;
    background:none;
    cursor:pointer;
    font-size:15px;
    color:inherit;
}

.links button:hover{
    color:#4285f4;
}

.hero{
    min-height:500px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    background:linear-gradient(
        120deg,
        #e8f0fe,
        #e6f4ea,
        #fff
    );
    animation:background 5s infinite alternate;
}

.dark .hero{
    background:linear-gradient(
        120deg,
        #17213b,
        #173225,
        #202124
    );
}

.hero h1{
    font-size:60px;
    animation:up 1s;
}

.hero span{
    color:#4285f4;
}

.hero p{
    margin:20px;
    font-size:19px;
}

.btn{
    border:0;
    background:#4285f4;
    color:white;
    padding:13px 25px;
    border-radius:30px;
    cursor:pointer;
    margin:5px;
}

.btn:hover{
    transform:scale(1.05);
}

@keyframes up{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes background{

    from{
        background-position:left;
    }

    to{
        background-position:right;
    }

}

.section{
    padding:60px 6%;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.search{
    width:100%;
    max-width:600px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:30px;
    display:block;
    margin:20px auto;
    outline:none;
}

.dark .search{
    background:#292929;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px #0002;
    transition:.3s;
}

.dark .card{
    background:#202124;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:190px;
    object-fit:contain;
}

.card h3{
    margin:10px 0;
}

.price{
    color:#4285f4;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.heart{
    float:right;
    border:0;
    background:none;
    font-size:23px;
    cursor:pointer;
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#0009;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.popup.show{
    display:flex;
}

.box{
    background:white;
    color:#222;
    width:100%;
    max-width:450px;
    padding:30px;
    border-radius:20px;
    position:relative;
    animation:pop .3s;
    max-height:90vh;
    overflow:auto;
}

.dark .box{
    background:#202124;
    color:white;
}

@keyframes pop{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.close{
    position:absolute;
    right:15px;
    top:15px;
    border:0;
    background:none;
    cursor:pointer;
    font-size:20px;
}

.box input,
.box textarea,
.box select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

.dark .box input,
.dark .box textarea,
.dark .box select{
    background:#292929;
    color:white;
}

.cart-item{
    display:flex;
    gap:12px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:60px;
    height:60px;
    object-fit:contain;
}

.cart-info{
    flex:1;
}

footer{
    background:#202124;
    color:white;
    text-align:center;
    padding:40px 20px;
}

@media(max-width:650px){

    nav{
        padding:15px;
    }

    .links{
        gap:7px;
    }

    .links button{
        font-size:12px;
    }

    .hero h1{
        font-size:38px;
    }

}

</style>

/* ==================================
   DISPLAY PRODUCTS
================================== */

function displayProducts(list){

let html = "";


list.forEach(function(product){

let liked =
wishlist.includes(product.id)
? "❤️"
: "♡";


html += `

<div class="card">

    <button
        class="heart"
        onclick="toggleWishlist(${product.id})">

        ${liked}

    </button>

    <img
        src="${product.image}"
        class="card img">

    <h3>
        ${product.name}
    </h3>

    <p>
        ${product.description}
    </p>

    <div class="price">
        $${product.price}
    </div>

    <button
        class="btn"
        onclick="details(${product.id})">

        Details

    </button>

    <button
        class="btn"
        onclick="addCart(${product.id})">

        Add 🛒

    </button>

</div>

`;

});


document.getElementById(
"productList"
).innerHTML = html;

}


/* ==================================
   SEARCH
================================== */

function searchProduct(){

let value =
document.getElementById(
"search"
).value.toLowerCase();


let result =
products.filter(function(product){

return (
product.name
.toLowerCase()
.includes(value)
||
product.category
.toLowerCase()
.includes(value)
);

});


displayProducts(result);

}


/* ==================================
   ADD CART
================================== */

function addCart(id){

let product =
products.find(
p => p.id === id
);


let existing =
cart.find(
p => p.id === id
);


if(existing){

existing.quantity++;

}else{

cart.push({

...product,

quantity:1

});

}


updateCart();

toast(
product.name +
" added to cart 🛒"
);

}


/* ==================================
   CART COUNT
================================== */

function updateCart(){

let total = 0;


cart.forEach(function(item){

total += item.quantity;

});


let count =
document.getElementById(
"cartCount"
);


if(count){

count.innerHTML = total;

}

}


/* ==================================
   CART POPUP
================================== */

function openCart(){

let html = "";


cart.forEach(function(item){

html += `

<div class="cart-item">

    <img
        src="${item.image}">

    <div class="cart-info">

        <b>
            ${item.name}
        </b>

        <p>
            $${item.price}
        </p>

        <button
            onclick="quantity(${item.id},-1)">
            -
        </button>

        ${item.quantity}

        <button
            onclick="quantity(${item.id},1)">
            +
        </button>

    </div>

    <button
        onclick="removeCart(${item.id})">

        🗑️

    </button>

</div>

`;

});


let total =
cart.reduce(
(sum,item) =>
sum + item.price * item.quantity,
0
);


document.body.insertAdjacentHTML(
"beforeend",

`

<div class="popup show" id="cartPopup">

<div class="box">

<button
class="close"
onclick="closePopup('cartPopup')">
❌
</button>

<h2>
🛒 Your Cart
</h2>

${html || "<p>Cart is empty.</p>"}

<h2>
Total: $${total}
</h2>

<button
class="btn"
onclick="checkout()">

Checkout 💳

</button>

</div>

</div>

`

);

}


/* ==================================
   QUANTITY
================================== */

function quantity(id,amount){

let item =
cart.find(
p => p.id === id
);


if(item){

item.quantity += amount;

}


if(item &&
item.quantity <= 0){

removeCart(id);

return;

}


closePopup("cartPopup");

updateCart();

openCart();

}


/* ==================================
   REMOVE CART
================================== */

function removeCart(id){

cart =
cart.filter(
item => item.id !== id
);

closePopup("cartPopup");

updateCart();

openCart();

}


/* ==================================
   WISHLIST
================================== */

function toggleWishlist(id){

if(
wishlist.includes(id)
){

wishlist =
wishlist.filter(
item => item !== id
);

}else{

wishlist.push(id);

}


if(
document.getElementById("productList")
){

displayProducts(
products
);

}


toast("Wishlist updated ❤️");

}

/* ==================================
