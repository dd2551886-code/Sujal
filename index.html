<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sujal Kafle Portfolio</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url("https://www.devtomark.com/assets/web_dev_intern-CsKPuUEU.png");
      background-size: cover;
      background-position: center;
      font-family: Arial;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #111;
      color: white;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #00eaff;
    }

    /* Login */
    .login-box {
      width: 300px;
      margin: 100px auto;
      padding: 30px;
      background: #111;
      border: 2px solid #00eaff;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 25px #00eaff;
    }

    .login-box h1 {
      color: #00eaff;
    }

    .login-box input {
      width: 90%;
      padding: 12px;
      margin: 10px;
      background: #222;
      color: white;
      border: 1px solid #00eaff;
      border-radius: 8px;
    }

    .login-box button {
      width: 95%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #00eaff;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 15px #00eaff;
    }

    #message {
      color: #ff4444;
    }
    .text{
      background: black;
    }
    .box {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  margin: 15px 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #00eaff;
  box-shadow: 0 0 10px #00eaff;
}

.box h2 {
  color: #00eaff;
}
  </style>
</head>

<body>

  <nav class="navbar">
    <h2>Sujal Kafle</h2>

    <div class="nav-links">
      <a href="#" onclick="home()">Home</a>
      <a href="#" onclick="about()">About</a>
      <a href="#" onclick="project()">Projects</a>
      <a href="#" onclick="contact()">Contact</a>
      <a href="#" onclick="showLogin()">Login</a>
    </div>
  </nav>
  

  <div id="page"></div>

  <script>
  function home() {
  document.getElementById("page").innerHTML = `
    <div class="box">
      <h1>Welcome to My Portfolio</h1>
      <p class="text">
        Hello! My name is Sujal Kafle. I am learning web development
        and programming. I enjoy creating websites and learning new
        technologies. My goal is to become a software engineer.
      </p>
    </div>
  `;
}
    function showLogin() {
  document.getElementById("page").innerHTML = `
    <div class="login-box">
      <button class="close" onclick="closeLogin()">❌</button>

      <h1>LOGIN</h1>

      <input id="username" type="text" placeholder="Username">
      <input id="password" type="password" placeholder="Password">

      <button onclick="login()">LOGIN</button>

      <p id="message"></p>
    </div>
  `;
}
function about() {
  document.getElementById("page").innerHTML = `
    <div class="box">
      <h1>About Me</h1>
      <p>
        My name is Sujal Kafle. I am learning HTML, CSS,
        JavaScript and Python. I enjoy building websites
        and programming projects. My goal is to become
        a software engineer.
      </p>
    </div>
  `;
}
function project() {
  document.getElementById("page").innerHTML = `
    <div class="box">
      <h1 class='h1'>My Projects</h1>

      <p>🌐 HTML Website</p>
      <p>🎨 CSS Design</p>
      <p>⚡ JavaScript Project</p>
      <p>🐍 Python Project</p>
      <p>🔐 Login System</p>
    </div>
  `;
}
function contact() {
  document.getElementById("page").innerHTML = `
    <div class="box">
      <h1>Contact Me</h1>
      <p>📞 Contact Number: 9840492959</p>
      <p>📧 Email: sujal@example.com</p>
    </div>
  `;
}
    
function closeLogin() {
  document.getElementById("page").innerHTML = "";
}

function login() {
  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;

  if (username === "" || password === "") {
    document.getElementById("message").innerHTML =
      "Please fill all fields!";
  } else {
    document.getElementById("message").style.color = "#00ff88";
    document.getElementById("message").innerHTML =
      "Login successful!";
  }
}
  </script>
  

</body>
  </html>
